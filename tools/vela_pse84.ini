; Vela configuration for Infineon PSoC Edge E84 (PSE84) - Ethos-U55
;
; Hardware parameters confirmed from two independent sources:
;   1. SVD reset value of NPU CONFIG register (offset 0x44600028) = 0x1807
;        bits[3:0]   = 7    -> 2^7 = 128 MACs/cc
;        bits[15:8]  = 0x18 -> 24 KB NPU-internal SHRAM
;   2. Infineon developer community: "NPU operating at 400 MHz with
;      128 MACs per cycle"
;
; Port model follows Arm's Ethos_U55_High_End_Embedded profile (both AXI
; ports are on-chip SRAM) with the clock lowered to PSE84's 400 MHz NPU.
;
; arena_cache_size (--arena-cache-size) is the NPU-internal SHRAM used as a
; feature-map cache. The model's own tensor arena is a runtime allocation in
; SOCMEM and is unrelated to this parameter, so 0 (no caching) is correct.

[System_Config.Ethos_U55_128]
core_clock=400e6
axi0_port=Sram
axi1_port=Sram
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8

[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0
